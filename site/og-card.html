<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #e7eaf0;
        background:
          radial-gradient(700px 400px at 85% 0%, rgba(139, 124, 255, 0.35), transparent 60%),
          radial-gradient(600px 400px at 0% 100%, rgba(56, 217, 196, 0.25), transparent 60%),
          #0b0d12;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 80px;
        box-sizing: border-box;
      }
      .b {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 700;
      }
      h1 {
        font-size: 64px;
        line-height: 1.08;
        margin: 28px 0 22px;
        letter-spacing: -0.02em;
        max-width: 980px;
      }
      .g {
        background: linear-gradient(90deg, #8b7cff, #38d9c4);
        -webkit-background-clip: text;
        color: transparent;
      }
      .m {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 30px;
        color: #9aa3b5;
      }
      .m b {
        color: #ff7a8a;
        font-weight: 600;
      }
      .m i {
        color: #5ee6a8;
        font-style: normal;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="b"><img src="favicon.svg" width="56" height="56" alt="" />repo-cloak</div>
    <h1>Share private code with AI agents, <span class="g">without sharing your secrets.</span></h1>
    <div class="m"><b>AcmeClient</b> &#8594; <i>NorthwindClient</i> &#8594; <b>AcmeClient</b></div>
  </body>
</html>
