<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>repo-cloak · Local dashboard</title>
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app-frame">
      <header class="topbar">
        <a class="brand" href="#"><span class="brand-mark" data-icon="cloak"></span>repo-cloak</a>
        <nav class="tabs" aria-label="Dashboard sections">
          <button id="workspaces-tab" class="active" type="button">Workspaces</button>
          <button id="profiles-tab" type="button">Profiles</button>
          <button id="settings-button" type="button">Settings</button>
        </nav>
        <div class="utilities">
          <label class="search" aria-label="Quick filter">
            <span data-icon="search"></span>
            <input id="global-search" type="search" placeholder="Filter workspaces…" />
          </label>
          <button
            id="theme-toggle"
            class="icon-pill quiet"
            type="button"
            aria-label="Switch theme"
          ></button>
          <button
            id="refresh"
            class="icon-pill quiet"
            type="button"
            data-icon="refresh"
            aria-label="Refresh"
            title="Refresh workspaces"
          ></button>
        </div>
      </header>

      <div id="notice" role="status" aria-live="polite"></div>
      <button id="resume" class="quiet" type="button" hidden>Return to wizard</button>

      <main id="main" tabindex="-1">
        <div id="dashboard-grid" class="layout">
          <aside class="repo-col">
            <div class="section">
              <h2>Repositories</h2>
              <span id="repository-count" class="repo-count"></span>
              <div class="repo-heading-actions">
                <button
                  id="new-group"
                  class="quiet icon-pill"
                  type="button"
                  data-icon="group"
                  aria-label="Create repository group"
                  title="New group"
                ></button>
                <button
                  id="add-repo"
                  class="quiet icon-pill"
                  type="button"
                  data-icon="plus"
                  aria-label="Add source repository"
                  title="Add source repository"
                ></button>
              </div>
            </div>
            <nav id="repos" aria-label="Repositories"></nav>
          </aside>

          <section class="ws-col">
            <div class="ws-heading">
              <h1 id="title">Workspaces</h1>
              <div class="ws-heading-actions">
                <div id="group-controls" class="ws-heading-actions" hidden>
                  <div id="group-open"></div>
                  <button id="edit-group" class="quiet ws-more" type="button">Edit group</button>
                  <button
                    id="group-requests"
                    class="quiet ws-more"
                    type="button"
                    data-icon="request"
                  >
                    Requests
                  </button>
                  <button id="pull-group" class="sync-btn pull-btn" type="button" data-icon="pull">
                    Pull all
                  </button>
                  <button id="push-group" class="sync-btn push-btn" type="button" data-icon="push">
                    Push all
                  </button>
                </div>
                <button id="join-group" class="quiet ws-more" type="button" data-icon="group">
                  Add to group
                </button>
                <button id="new-ws" class="new-ws" type="button" data-icon="plus">
                  New workspace
                </button>
              </div>
            </div>
            <section id="ws-view" aria-label="Workspaces"></section>
          </section>
        </div>

        <section id="settings-view" class="manage view-box" aria-label="Settings" hidden></section>
        <section
          id="wizard"
          class="panel view-box"
          tabindex="-1"
          aria-label="Sync wizard"
          hidden
        ></section>

        <section id="profile-view" class="manage view-box" aria-label="Profiles" hidden>
          <div class="toolbar prof-head">
            <div>
              <h2>Profiles</h2>
              <p class="muted">Rules for names, paths, and secrets.</p>
            </div>
            <div class="actions">
              <button id="check-profiles" class="quiet" type="button">Check selected</button>
              <button id="import-profile" class="quiet" type="button">Import JSON</button>
              <input id="import-profile-file" type="file" accept=".json,application/json" hidden />
              <button id="new-profile" type="button" data-icon="plus">New profile</button>
            </div>
          </div>
          <div class="prof-grid">
            <div id="profiles"></div>
            <form id="editor" hidden>
              <div class="toolbar editor-head">
                <h2 id="editor-title">New profile</h2>
                <button
                  id="delete-profile"
                  class="quiet trash"
                  type="button"
                  data-icon="trash"
                  aria-label="Delete profile"
                  title="Delete profile"
                  hidden
                ></button>
                <button id="close-editor" class="quiet" type="button">Close</button>
              </div>
              <div class="editor-body">
                <div class="editor-options">
                  <label>Save for<select id="scope"></select></label>
                  <div class="tabs sub-tabs" aria-label="Editor mode">
                    <button id="form-tab" class="active" type="button">Form</button>
                    <button id="json-tab" type="button">JSON</button>
                  </div>
                </div>
                <div id="form-fields">
                  <div class="rule-grid">
                    <label>Name<input id="profile-name" required /></label>
                    <label>Description<input id="profile-description" /></label>
                  </div>
                  <div class="rule-grid">
                    <label
                      >Exclude files (one pattern per line)<textarea
                        id="profile-exclude"
                        rows="3"
                        spellcheck="false"
                        placeholder="*.schema.json&#10;generated/&#10;/config/secrets.yml"
                      ></textarea>
                    </label>
                    <label
                      >Include files skipped by default<textarea
                        id="profile-include"
                        rows="3"
                        spellcheck="false"
                        placeholder="package-lock.json&#10;dist/types/"
                      ></textarea>
                    </label>
                  </div>
                  <p class="muted">
                    Use .gitignore patterns. A leading / anchors to the root. Exclusions always win.
                  </p>
                  <div class="toolbar rules-head">
                    <h3>Rules</h3>
                    <button id="add-rule" class="quiet" type="button" data-icon="plus">
                      Add rule
                    </button>
                  </div>
                  <div id="rules"></div>
                  <p class="muted">Use JSON for styles, forms, and exceptions.</p>
                </div>
                <label id="json-field" hidden
                  >Profile JSON<textarea id="profile-json" rows="14" spellcheck="false"></textarea>
                </label>
              </div>
              <div class="actions editor-actions">
                <button type="submit">Save profile</button>
                <button
                  id="export-profile"
                  class="quiet"
                  type="button"
                  title="Download decrypted profile JSON, including original names"
                >
                  Export JSON
                </button>
              </div>
            </form>
          </div>
        </section>

        <footer>repo-cloak v2 <span>Local only · No cloud account</span></footer>
      </main>
    </div>
  </body>
</html>
